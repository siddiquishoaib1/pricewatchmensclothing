name: Weekly price check

# NOTE: GitHub's shared runners get 429'd by these stores from the very
# first request, so this will only produce real data on a SELF-HOSTED
# runner on your own machine. See README. Left here on workflow_dispatch
# so you can trigger it manually once a self-hosted runner is set up.
#
# To run on your own machine, change `runs-on: ubuntu-latest` below to
# `runs-on: self-hosted` and uncomment the schedule.

on:
  # schedule:
  #   # 04:10 UTC Monday = 09:10 Monday, Pakistan time.
  #   - cron: "10 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python test_watchlist.py

      - name: Check watchlist
        run: python watcher.py

      - name: Commit the report
        if: always()
        run: |
          git config user.name  "price-watcher"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No change today."
          else
            git commit -m "Price check $(date -u +'%Y-%m-%d')"
            git push
          fi
