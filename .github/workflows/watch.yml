name: Daily price check

on:
  schedule:
    # 04:10 UTC = 09:10 Pakistan time, daily.
    # GitHub queues scheduled jobs, so the real run may be 5-30 min late.
    - cron: "10 4 * * *"
  workflow_dispatch:        # lets you run it on demand from the Actions tab

permissions:
  contents: write           # needed to commit the report back

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          python test_matching.py
          python test_watcher.py

      - name: Check prices
        run: python watcher.py --min-drop 10

      - name: Commit the report
        run: |
          git config user.name  "price-watcher"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No change in prices today."
          else
            git commit -m "Price check $(date -u +'%Y-%m-%d')"
            git push
          fi
